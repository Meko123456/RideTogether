name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu builds the shared Kotlin + Android app. iOS targets are compiled
    # locally on macOS (Xcode); CI covers the shared logic and Android.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build + test shared and Android
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace
