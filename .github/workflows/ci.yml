name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu builds the shared Kotlin + Android app. iOS targets are compiled
    # locally on macOS (Xcode); CI covers the shared logic and Android.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # :shared holds 197 of the 220 tests and all of the domain logic, so it is the module
      # lint most needs to see. :androidApp:lintDebug does not reach it: lint stops at the module
      # boundary, and AGP's KMP library plugin registers no lint task of its own unless the
      # standalone lint plugin is applied, which shared/build.gradle.kts now does.
      - name: Build + test shared and Android
        run: ./gradlew :shared:testAndroidHostTest :shared:lint :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace

      # R8 and resource shrinking only run for release, so a debug-only CI lets the release build
      # rot until submission day. Cheap here, and it has bitten this toolchain before.
      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :androidApp:assembleRelease :androidApp:lintVitalRelease --stacktrace

  ios:
    # The iOS targets can only be compiled on macOS, so without this leg they are decorative:
    # they sat in the build file for four commits while commonMain did not actually compile for
    # Native (a JVM-only annotation), and nothing noticed. This runs the same shared test suite
    # on the simulator target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test shared on the iOS simulator target
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:compileKotlinIosArm64 --stacktrace

      # Linking is a stronger claim than compiling, and it is the one that breaks the moment a
      # native dependency reaches :shared. SyncBeats cannot get past this step at all, because the
      # Firebase iOS SDK is not integrated there. This module has no native dependencies and should
      # stay that way, so the check is here to notice if that changes.
      - name: Link the iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

  iosApp:
    # The Swift app gets built, not just the shared framework it links against. A native UI that
    # nothing compiles rots exactly the way a declared-but-never-built Kotlin target does, and this
    # fleet has learned that lesson twice already.
    #
    # The project file is generated by XcodeGen from project.yml rather than committed, so the
    # generation step is part of the check: a project.yml that no longer produces a buildable
    # project is the same failure as a source file that will not compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # The simulator is chosen rather than named. Runner images change which devices they carry,
      # and a hardcoded "iPhone 16" turns an image update into a red build for no reason.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "using $UDID"

      # `test`, not `build`. Everything this app decides is decided in Kotlin, so a successful build
      # proves the two languages agree about types and says nothing about whether a tap reaches the
      # engine and an answer comes back. The UI tests drive exactly that chain, including the
      # engine's grace periods, which is why they take a couple of minutes rather than seconds.
      #
      # Building the shared Kotlin framework is a pre-build step of the Xcode target, so this also
      # proves the Gradle and Xcode halves still agree about where the framework lands.
      - name: Build and test the iOS app
        working-directory: iosApp
        run: |
          xcodebuild test -project RideTogether.xcodeproj -scheme RideTogether \
                     -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
                     -configuration Debug

  rules:
    # The security rules are the only thing between a ride and anyone with an account, so they get a
    # real test run: the Firebase emulator, against the actual rules file. Java is here because the
    # emulator is a Java process.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/rules-tests/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        working-directory: tools/rules-tests
        run: npm ci

      - name: Test the database rules
        working-directory: tools/rules-tests
        run: npm test
